# 채권·원자재·크립토는 주식 지수 국면과 따로 논다.
# 이 그룹은 시장 국면 게이트를 자기 추세로 대체한다.
# ─────────────────────────────────────────────────────────────
#  어떤 그룹만 볼지. 지금은 개별종목만 본다.
#  지수·섹터까지 받고 싶으면 아래 목록에 줄을 추가하거나,
#  watch_groups: [] 로 비우면 전부 대상이 된다.
#
#  쓸 수 있는 이름:
#    미국 개별주 · 한국 단일종목 · 미국 지수 · 미국 섹터 · 미국 테마
#    미국 해외지수 · 미국 채권 · 미국 원자재 · 미국 크립토
#
#  개별종목만 보면 신호가 훨씬 드뭅니다. 종목 하나가 무너질 때의
#  낙폭도 지수보다 크므로, 비중 상한을 꼭 지키세요.
# ─────────────────────────────────────────────────────────────
watch_groups:
  - "미국 개별주"
  - "한국 단일종목"

# ─────────────────────────────────────────────────────────────
#  종목 직접 추가하기
#
#  단일종목 레버리지는 계속 새로 상장되고 티커도 자주 바뀝니다.
#  아래 형식으로 universe 에 줄을 추가하면 바로 감시 대상이 됩니다.
#
#    - u: "UBER"                  기초자산 티커 (판정용, 본주)
#      name: "우버"
#      group: "미국 개별주"
#      market: US
#      vol_max: 0.040             ATR 상한. 변동성 큰 종목일수록 크게
#      long:  [["UBRL", 2]]       오를 때 사는 상품 [티커, 배수]
#      short: [["UBRS", -2]]      내릴 때 사는 상품. 없으면 []
#
#  추가한 뒤 Actions 에서 '티커 점검' 을 체크하고 실행하면
#  실제로 데이터가 나오는지 확인해줍니다. 실패한 줄은 지우세요.
# ─────────────────────────────────────────────────────────────

