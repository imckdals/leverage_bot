# ─────────────────────────────────────────────────────────────
#  레버리지 관제 — 설정
#
#  구조: 기초자산 1개 = 카드 1장.
#  같은 기초자산을 쓰는 레버리지 상품은 전부 한 판단에 묶인다.
#  (TQQQ·QLD·SQQQ·QID·PSQ 는 결국 QQQ 추세 하나로 결정된다)
#
#  long / short = [티커, 배수] 목록. 배수 음수 = 인버스.
#  vol_max = ATR20/종가 상한. 이 위면 감가가 이겨서 진입 안 함.
#
#  티커는 수시로 상장·폐지·분할된다. `python run.py --audit` 로
#  현재 살아 있는 티커만 남기고 정리하세요.
# ─────────────────────────────────────────────────────────────

alerts:
  channel: console            # telegram | discord | console
  telegram:
    bot_token: ""             # @BotFather 에서 발급
    chat_id: ""               # @userinfobot 에게 아무 말이나 보내면 알려줌
  discord:
    webhook_url: ""
  # simple = 살 종목과 팔 조건만. full = 근거·대체종목까지 전부.
  style: simple
  # minimal = 살 것/팔 것만, 없으면 "없음" 한 줄.
  # full    = 보유 현황·근접 종목·점검 통계까지.
  digest_style: minimal
  notify_on:
    entry: true
    exit: true
    watch: false
  # 보유 중인 종목의 손익·손절까지 거리를 매일 보내준다.
  #   always       매일 보냄 (보유 없으면 한 줄)
  #   when_holding 보유 중일 때만 (권장)
  #   off          끔
  daily_digest: when_holding
  digest_time: "08:30"              # 켜면 알림이 꽤 늘어난다

# ─────────────────────────────────────────────────────────────
#  일정 회피
#  실적 발표는 갭으로 움직여서 손절가에 팔 수가 없다.
#  예측은 하지 않고, 그 구간을 피하기만 한다.
# ─────────────────────────────────────────────────────────────
events:
  enabled: true
  use_earnings: true
  block_days_before_earnings: 5   # 실적 5일 전부터 신규 진입 차단
  warn_days_before_earnings: 3    # 보유 중이면 3일 전부터 알림
  # 국내는 실적일 사전 공지가 없다. 분기 종료 후 영업일 4~10일 사이라는
  # 패턴으로 구간을 추정해 그 기간 전체를 막는다. 정확한 날짜가 아니다.
  estimate_korean: true

  use_macro: true
  block_days_before_macro: 1      # 거시 일정 전날부터 차단
  # 연준 공식 페이지에서 일정을 자동으로 받아온다.
  # 실패하면 아래 목록을 그대로 쓰므로 멈추지 않는다.
  auto_fomc: true

  # FOMC 금리 결정일 (발표는 이틀째). 연준 공식 일정 기준.
  # 지난 날짜는 자동으로 무시되니 그냥 두셔도 됩니다.
  # CPI 등 다른 일정도 같은 형식으로 추가할 수 있습니다.
  macro_calendar:
    - {date: "2026-09-16", name: "FOMC"}
    - {date: "2026-10-28", name: "FOMC"}
    - {date: "2026-12-09", name: "FOMC"}
    - {date: "2027-01-27", name: "FOMC"}
    - {date: "2027-03-17", name: "FOMC"}
    - {date: "2027-04-28", name: "FOMC"}
    - {date: "2027-06-09", name: "FOMC"}
    - {date: "2027-07-28", name: "FOMC"}
    - {date: "2027-09-15", name: "FOMC"}
    - {date: "2027-10-27", name: "FOMC"}
    - {date: "2027-12-08", name: "FOMC"}

portfolio:
  # 한 번의 매매에서 총자산의 몇 %까지 잃을 각오인지.
  # 손절폭이 -25% 면 총자산의 8% 만 넣게 계산된다 (0.02 / 0.25).
  risk_per_trade: 0.02
  # 배수로 나눈 절대 상한. 3배면 총자산의 10%, 2배면 15% 가 한도가 된다.
  # 손절이 좁게 잡히는 날 비중이 터무니없이 커지는 걸 막는다.
  max_position: 0.30

server:
  # 비워두면 인증 없음 (자기 컴퓨터에서만 볼 때).
  # 서버에 올려서 밖에서 볼 거면 반드시 채우세요. 아이디는 아무거나,
  # 비밀번호만 맞으면 됩니다.
  password: ""

schedule:
  timezone: "Asia/Seoul"
  runs:
    - "15:45"                 # 한국 정규장 마감 직후
    - "06:10"                 # 미국 정규장 마감 직후

rules:
  # ── 직진성 · 이 도구의 핵심 ────────────────────────────────
  # 기초자산이 같은 폭을 움직여도, 한 방향으로 쭉 간 경우와
  # 오르내리며 도달한 경우 레버리지 수익률은 완전히 달라진다.
  # 아래 세 조건이 "확실히 쭉 가는 중"만 통과시키는 장치다.
  straight:
    er_strong: 0.15     # 이 이상이면 그것만으로 통과 (원래 매끄러운 지수용)
    er_min: 0.10        # 절대 하한. 이 아래는 백분위가 높아도 탈락        # 효율성비율 = 60일 순이동 ÷ 실제 이동거리 합
                        #   1.0 = 완전한 직선, 0.05 = 왔다갔다 제자리
                        #   참고값: 강한 추세 0.33 / 보통 상승 0.19
                        #          출렁이는 상승 0.06 / 횡보 0.04
    r2_strong: 0.45     # 이 이상이면 그것만으로 통과
    r2_min: 0.30        # 절대 하한        # 로그가격 직선회귀 R². 경로가 매끄러운가
                        #   참고값: 강한 추세 0.87 / 보통 상승 0.64
                        #          출렁이는 상승 0.16 / 횡보 0.10
    pctile_min: 0.70    # 자기 2년 이력 대비 상위 30% 안에 드는 직진성일 것.
                        # 지수는 원래 매끄럽고 개별주는 원래 거칠어서,
                        # 절대 기준만 쓰면 개별주가 영원히 통과 못 한다.
    horizon_days: 20    # 감가·추세이익을 계산하는 기간
    decay_budget: 0.35  # 예상 감가가 예상 추세이익의 35% 넘으면 탈락

  long:
    min_gates: 9              # 게이트 9개 전부. 필수 8 + 보조 1
    watch_gates: 8
    cooldown_days: 10
  short:
    min_gates: 9              # 게이트 10개 중. 인버스는 한 칸 더 빡빡하게
    watch_gates: 8
    cooldown_days: 15
    vol_multiplier: 1.3       # 하락장은 원래 변동성이 높아 상한을 완화
  exit:
    below_ma20_days: 2
    vol_spike_mult: 1.6
    target_r: 2.0       # 목표가 = 손절폭의 몇 배. 기본은 '참고선' 이고
                        # 자동 청산은 하지 않는다 (추세 끝까지 들고 감).
    take_profit: null   # 숫자를 넣으면 실제 익절 규칙이 된다. 예: 0.35
                        # 켜기 전에 backtest.py 로 도움이 되는지 확인하세요.
    time_stop_days: 20  # 이 거래일이 지나도 못 벌고 있으면 청산.
    time_stop_min_return: 0.0   # 감가가 계속 갉아먹기 때문에 제자리 = 손실
    stop_loss: 0.20     # 레버리지 상품 기준 -20% 면 무조건 청산.
                        # 추세 이탈 신호는 며칠 걸리는데 3배 상품은
                        # 그 사이 -40% 가 가능해서 별도 하한이 필요하다.

